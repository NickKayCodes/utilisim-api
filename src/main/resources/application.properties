spring.application.name=utilisim
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:<postgres port number>/<db name>
spring.datasource.username=<enter postgres username here>
spring.datasource.password=<enter your db postgres password here>
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true